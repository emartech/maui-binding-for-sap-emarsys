name: Create Release Draft

on:
  workflow_call:

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yaml
    secrets: inherit

  build-package:
    name: Build NuGet Package
    needs: run-tests
    uses: ./.github/workflows/build-nuget-package.yaml
    secrets: inherit

  build-samples:
    name: Build Sample Apps
    needs: build-package
    uses: ./.github/workflows/build-sample-apps.yaml
    secrets: inherit
    with:
      package-version: ${{ needs.build-package.outputs.version }}

  tag-and-draft:
    name: Tag and Create Release Draft
    needs: [build-samples]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check version consistency
      run: bash scripts/check-version-consistency.sh

    - name: Get version and notes from CHANGELOG
      id: get-version
      run: |
          VERSION=$(grep -E "^# [0-9]+\.[0-9]+\.[0-9]+" CHANGELOG.md | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

          # Extract changelog content for this version (without the version header)
          # Find the line with the version header and get content until next version or end of file
          awk "/^# $VERSION/{flag=1; next} /^# [0-9]/{flag=0} flag" CHANGELOG.md > changelog_body.md
          echo "Changelog content extracted for version $VERSION"

    - name: Check if tag exists
      id: check-tag
      env:
        VERSION: ${{ steps.get-version.outputs.version }}
      run: |
        if git rev-parse "$VERSION" >/dev/null 2>&1; then
          echo "tag-exists=true" >> $GITHUB_OUTPUT
          echo "Tag $VERSION already exists"
        else
          echo "tag-exists=false" >> $GITHUB_OUTPUT
          echo "Tag $VERSION does not exist"
        fi

    - name: Create Git Tag
      id: create-tag
      env:
        VERSION: ${{ steps.get-version.outputs.version }}
        TAG_EXISTS: ${{ steps.check-tag.outputs.tag-exists }}
      run: |
        if [ "$TAG_EXISTS" == "false" ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$VERSION" -m "Release version $VERSION"
          git push origin "$VERSION"
          echo "tag-created=true" >> $GITHUB_OUTPUT
          echo "Created new tag $VERSION"
        else
          echo "tag-created=false" >> $GITHUB_OUTPUT
          echo "Tag already exists, skipping creation"
        fi

    - name: Create GitHub Release Draft
      if: steps.check-tag.outputs.tag-exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get-version.outputs.version }}
      run: |
        gh release create "$VERSION" \
          --draft \
          --title "$VERSION" \
          --notes-file changelog_body.md
        echo "Created draft release $VERSION"
