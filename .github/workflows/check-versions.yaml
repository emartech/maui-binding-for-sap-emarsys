name: Check Version Consistency

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version consistency
        run: bash scripts/check-version-consistency.sh
