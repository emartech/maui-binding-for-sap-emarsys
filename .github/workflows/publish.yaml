name: Publish MAUI Binding Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Import iOS Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/emartech/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Install .NET MAUI
        run: |
          dotnet workload install maui

          # Install compatible iOS workload version for Xcode 16.4
          dotnet workload install ios --version 9.0.100

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Objective-Sharpie and Xamarin.iOS
        run: |
          curl -o objectivesharpie.pkg https://download.visualstudio.microsoft.com/download/pr/3a748cc2-780d-403c-88ba-700aa9a2d299/88cbfd86e85f56b4c61e092d0f0b9ad9/objectivesharpie-3.5.116.pkg
          sudo installer -pkg objectivesharpie.pkg -target /
          curl -o xamarin.ios.pkg https://download.visualstudio.microsoft.com/download/pr/ceb0ea3f-4db8-46b4-8dc3-8049d27c0107/3960868aa9b1946a6c77668c3f3334ee/xamarin.ios-16.4.0.23.pkg
          sudo installer -pkg xamarin.ios.pkg -target /  

      - name: Build iOS Native Framework
        run: ./scripts/build-ios-framework.sh

      - name: Clean and Restore Dependencies
        run: | 
          mkdir -p artifacts
          dotnet clean common/Public && dotnet restore common/Public 

      - name: Build and Pack NuGet package
        run: |
          rm -f artifacts/*.nupkg || true
          dotnet pack common/Public/ --configuration Release --output ./artifacts

      - name: Setup Sample Apps Package References
        run: ./scripts/setup-sample-package-refs.sh

      - name: Run Unit Tests
        run: |
          dotnet restore test/
          dotnet test test/ --configuration Release

      - name: Clean and Restore Sample App
        run: |
          dotnet clean sample && dotnet restore sample

      - name: Build Android Sample App (from NuGet package)
        run: |
          cd sample

          echo '${{ secrets.GOOGLE_SERVICE_JSON }}' > google-services.json
          dotnet build -f net9.0-android --configuration Release

      - name: Build iOS Sample App (from NuGet package)
        run: |
          cd sample
          # Build for iOS without code signing
          dotnet build -f net9.0-ios --configuration Release \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:CodesignEntitlements="" \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:BuildIpa=false \
            -p:_RequireCodeSigning=false \
            -p:MtouchUseLlvm=false

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --skip-duplicate
